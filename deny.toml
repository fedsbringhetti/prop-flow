# Configurazione di cargo-deny. Vedi .github/workflows/ci.yml, job "dependencies".

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
# Un crate ritirato dal registry non deve restare in un lockfile che dichiariamo
# riproducibile.
yanked = "deny"
# Le deroghe sono motivate per iscritto: una deroga senza motivo diventa permanente
# per dimenticanza, e nessuno sa più se valga ancora.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = """
Marvin Attack: timing sidechannel nella decifratura RSA di `rsa` 0.9.x, tirato
nell'albero da jsonwebtoken con la feature `rust_crypto`.

Non raggiungibile da questo codice: si firma e si verifica esclusivamente con EdDSA
(Ed25519) — gli unici `Algorithm::` presenti sono `EdDSA` per i token e `Argon2id`
per le password. Il crate viene compilato ma nessun percorso RSA viene eseguito.

Non è eliminabile: la feature `rust_crypto` include `dep:rsa` senza possibilità di
escluderlo, e l'alternativa `aws_lc_rs` richiederebbe un toolchain C e cmake
nell'immagine di build, che è la ragione per cui `rust_crypto` è stata scelta.
L'advisory non ha una versione corretta: 0.9.10 è l'ultima pubblicata.

Da rivalutare se jsonwebtoken rende `rsa` opzionale, o se esce una versione di `rsa`
che corregge il problema.""" },
    { id = "RUSTSEC-2026-0387", reason = """
Timing variabile in operazioni che dovrebbero essere a tempo costante, in
`crypto-bigint` 0.5.5. Lo tira nell'albero jsonwebtoken 11 con la feature
`rust_crypto`, attraverso `p256` e `p384` → `elliptic-curve`: è l'aritmetica di
ECDSA.

Non raggiungibile da questo codice, per la stessa ragione della deroga qui sopra: si
firma e si verifica solo con EdDSA, e nessun percorso ECDSA viene eseguito. La
correzione esiste solo dalla 0.7.6, una major che `elliptic-curve` 0.13 non accetta,
quindi non c'è un `cargo update` che la porti.

Da rivalutare con jsonwebtoken 12, uscito il 13 novembre 2026, che passa a `p256` e
`p384` 0.14: è un salto di major della libreria dei token, e va fatto a parte e non
dentro una correzione del lockfile.""" },
    # Le quattro advisory di `zip` hanno la stessa causa e la stessa ragione: una sola
    # spiegazione, ripetuta per riferimento, invece di quattro che possono divergere.
    { id = "RUSTSEC-2026-0367", reason = "zip 3.0.0, dipendenza di build di utoipa-swagger-ui: vedi RUSTSEC-2026-0429" },
    { id = "RUSTSEC-2026-0368", reason = "zip 3.0.0, dipendenza di build di utoipa-swagger-ui: vedi RUSTSEC-2026-0429" },
    { id = "RUSTSEC-2026-0369", reason = "zip 3.0.0, dipendenza di build di utoipa-swagger-ui: vedi RUSTSEC-2026-0429" },
    { id = "RUSTSEC-2026-0429", reason = """
Quattro advisory su `zip` 3.0.0 (questa, 0367, 0368, 0369), tutte sull'estrazione
di archivi costruiti ad arte. La correzione è dalla 9.0.0.

Non raggiungibile: `zip` è una dipendenza **di build** di `utoipa-swagger-ui`, che
la usa nel suo `build.rs` per scompattare l'archivio di Swagger UI. Con la feature
`vendored` quell'archivio arriva dal crate `utoipa-swagger-ui-vendored`, fissato nel
lockfile con il suo checksum: nessun input non fidato, nessuna estrazione a runtime,
e niente di `zip` finisce nel binario.

Non eliminabile oggi: `utoipa-swagger-ui` 9.0.2, l'ultima pubblicata, chiede
`zip ^3.0`. Da rivalutare quando una sua versione accetta `zip` 9.""" },
]

[bans]
# Versioni duplicate della stessa libreria: segnalate, non bloccanti. Nell'albero
# di sqlx e del toolkit async sono spesso inevitabili e imposte da terzi.
multiple-versions = "warn"
wildcards = "deny"
# Le path dependency interne non dichiarano una versione, quindi contano come
# wildcard. Sono crate privati, mai pubblicati, e il percorso li fissa esattamente:
# il divieto serve contro un `dep = "*"` verso crates.io, non contro i membri del
# workspace.
allow-wildcard-paths = true
# Nessuna dipendenza vietata per ora. Esempio di uso futuro:
# deny = [{ crate = "openssl", reason = "si usa rustls" }]
deny = []

[sources]
# Solo crates.io. Una dipendenza da un repository git arbitrario è codice di terzi
# senza revisione né versionamento stabile.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
