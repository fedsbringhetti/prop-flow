# Valori di default per lo sviluppo locale.
# Le variabili d'ambiente con prefisso PROPFLOW__ hanno la precedenza, quindi in
# produzione questo file può restare com'è o mancare del tutto.
#
# Nessun segreto qui: URL con password e percorsi delle chiavi arrivano
# dall'ambiente o dal gestore dei segreti.

[server]
bind = "0.0.0.0:8080"
request_timeout_seconds = 30
body_limit_bytes = 1048576
# 25 MiB, solo sulle rotte di caricamento dei documenti. Il limite generale resta
# 1 MiB: alzarlo per servire l'upload indebolirebbe ogni altro endpoint.
upload_body_limit_bytes = 26214400
# `Secure` sul cookie del refresh token. `true` è il valore che il progetto
# spedisce, e resta `true` anche qui: questo file finisce nell'immagine, e un
# default comodo per lo sviluppo diventerebbe la configurazione di produzione di
# chi non lo sovrascrive. Lo sviluppo su `http://localhost` lo disattiva
# dall'ambiente — vedi `.env.example` — perché il browser non manda un cookie
# `Secure` su HTTP e il refresh fallirebbe sempre.
secure_cookies = true

[database]
max_connections = 16
statement_timeout_seconds = 10

[auth]
issuer = "propflow"
audience = "propflow-api"
# 15 minuti: l'access token non è revocabile, quindi vive poco.
access_token_ttl_seconds = 900
# 30 giorni: il refresh token è revocabile e a rotazione singola.
refresh_token_ttl_days = 30

[storage]
# Lo storage del compose (SeaweedFS, ADR-057), sulla 9000 dell'host. In produzione
# è quello del compose di produzione, `http://storage:8333`.
endpoint = "http://localhost:9000"
region = "us-east-1"
bucket = "propflow-documents"
# Ogni endpoint personalizzato richiede il bucket nel percorso: lo stile
# virtual-host vorrebbe un DNS `<bucket>.<host>` che in locale non esiste.
path_style = true
# 5 minuti: l'URL pre-firmato è un permesso trasferibile, chi lo intercetta lo usa.
presign_ttl_seconds = 300
request_timeout_seconds = 30
# access_key_id e secret_access_key arrivano dall'ambiente: vedi la nota in testa.

[mail]
# 587 con STARTTLS è il caso normale di un relay vero; il raccoglitore locale del
# compose ascolta su 1025 e non cifra niente — vedi `.env.example`.
port = 587
from_name = "PropFlow"
encryption = "starttls"
timeout_seconds = 10
# host e from_address arrivano dall'ambiente: non hanno un default sensato, e
# inventarne uno sposterebbe il fallimento dall'avvio al primo invio — cioè al
# momento in cui qualcuno non riceve il codice per rientrare nel proprio account.

[telemetry]
service_name = "propflow-api"
filter = "info,propflow_api=debug,propflow_application=debug"
json_logs = false
