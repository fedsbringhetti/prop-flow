# Stack di sviluppo locale.
#
# `migrate` gira come `propflow_migrator` e deve completare prima che `api` e
# `worker` partano: applicare lo schema dal servizio che lo usa richiederebbe di
# dargli privilegi DDL che non deve avere.
services:
  postgres:
    image: postgres:16-alpine
    container_name: propflow-postgres
    environment:
      POSTGRES_DB: propflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # collazione deterministica: i test su ORDER BY/unique non devono dipendere dall'host
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - timezone=Europe/Rome
      - -c
      - log_min_duration_statement=200
      # niente parametri di query nei log: i valori possono contenere PII
      - -c
      - log_statement=none
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage oggetti per i documenti. In produzione al suo posto c'è S3: stesso
  # protocollo, stesso adattatore, cambia l'endpoint.
  minio:
    image: minio/minio:latest
    container_name: propflow-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: propflow
      MINIO_ROOT_PASSWORD: propflow-dev-secret
    ports:
      - "9000:9000"
      # Console web, comoda per guardare cosa c'è nel bucket.
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea il bucket una volta sola. Non lo fa l'API: creare un bucket è
  # un'operazione di provisioning, e darle il privilegio significherebbe darglielo
  # anche in produzione.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set propflow http://minio:9000 propflow propflow-dev-secret
        mc mb --ignore-existing propflow/propflow-documents
    restart: "no"

  migrate:
    build: .
    image: propflow:dev
    command: ["propflow-migrator"]
    environment:
      PROPFLOW__DATABASE__MIGRATOR_URL: postgres://propflow_migrator:migrator@postgres:5432/propflow
      PROPFLOW__DATABASE__MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: propflow:dev
    command: ["propflow-api"]
    environment:
      # Ruolo soggetto a Row Level Security.
      PROPFLOW__DATABASE__APPLICATION_URL: postgres://propflow_app:app@postgres:5432/propflow
      # Ruolo con BYPASSRLS: solo flussi pre-autenticazione.
      PROPFLOW__DATABASE__PRIVILEGED_URL: postgres://propflow_worker:worker@postgres:5432/propflow
      PROPFLOW__AUTH__PRIVATE_KEY_PATH: /run/secrets/jwt_ed25519.pem
      PROPFLOW__AUTH__PUBLIC_KEY_PATH: /run/secrets/jwt_ed25519.pub.pem
      PROPFLOW__STORAGE__ENDPOINT: http://minio:9000
      PROPFLOW__STORAGE__BUCKET: propflow-documents
      PROPFLOW__STORAGE__ACCESS_KEY_ID: propflow
      PROPFLOW__STORAGE__SECRET_ACCESS_KEY: propflow-dev-secret
      PROPFLOW__TELEMETRY__JSON_LOGS: "true"
      # Lo stack di compose parla HTTP su `localhost`, e un browser non manda un
      # cookie `Secure` su HTTP: senza questa riga il refresh fallirebbe sempre e
      # la sessione durerebbe i quindici minuti dell'access token. In produzione
      # va lasciata al default, che è `true`.
      PROPFLOW__SERVER__SECURE_COOKIES: "false"
    volumes:
      # Le chiavi arrivano come file in sola lettura, non da variabili d'ambiente:
      # generarle con ./ops/dev/generate-jwt-keys.sh
      - ./.secrets:/run/secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "propflow-api --version >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    image: propflow:dev
    command: ["propflow-worker"]
    environment:
      PROPFLOW__DATABASE__PRIVILEGED_URL: postgres://propflow_worker:worker@postgres:5432/propflow
      # Lo **stesso** bucket dell'API: il worker legge le scansioni che l'API ha
      # scritto, e due configurazioni divergenti darebbero job falliti su documenti
      # che l'API mostra benissimo.
      PROPFLOW__STORAGE__ENDPOINT: http://minio:9000
      PROPFLOW__STORAGE__BUCKET: propflow-documents
      PROPFLOW__STORAGE__ACCESS_KEY_ID: propflow
      PROPFLOW__STORAGE__SECRET_ACCESS_KEY: propflow-dev-secret
      RUST_LOG: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
