# Stack di sviluppo locale.
#
# `migrate` gira come `propflow_migrator` e deve completare prima che `api` e
# `worker` partano: applicare lo schema dal servizio che lo usa richiederebbe di
# dargli privilegi DDL che non deve avere.
services:
  postgres:
    image: postgres:16-alpine
    container_name: propflow-postgres
    environment:
      POSTGRES_DB: propflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # collazione deterministica: i test su ORDER BY/unique non devono dipendere dall'host
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - timezone=Europe/Rome
      - -c
      - log_min_duration_statement=200
      # niente parametri di query nei log: i valori possono contenere PII
      - -c
      - log_statement=none
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage oggetti per i documenti. In produzione al suo posto c'è S3: stesso
  # protocollo, stesso adattatore, cambia l'endpoint.
  minio:
    image: quay.io/minio/minio:latest
    container_name: propflow-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: propflow
      MINIO_ROOT_PASSWORD: propflow-dev-secret
    ports:
      - "9000:9000"
      # Console web, comoda per guardare cosa c'è nel bucket.
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea il bucket una volta sola. Non lo fa l'API: creare un bucket è
  # un'operazione di provisioning, e darle il privilegio significherebbe darglielo
  # anche in produzione.
  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set propflow http://minio:9000 propflow propflow-dev-secret
        mc mb --ignore-existing propflow/propflow-documents
    restart: "no"

  migrate:
    build: .
    image: propflow:dev
    command: ["propflow-migrator"]
    environment:
      PROPFLOW__DATABASE__MIGRATOR_URL: postgres://propflow_migrator:migrator@postgres:5432/propflow
      PROPFLOW__DATABASE__MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Il raccoglitore di posta dello sviluppo: accetta tutto, non recapita niente, e
  # mostra i messaggi su http://localhost:8025.
  #
  # **Non è un fornitore.** Non verifica SPF, DKIM né i rimbalzi: prova che il
  # messaggio parte e che cosa contiene, non che sarebbe recapitato — è lo stesso
  # limite che MinIO ha rispetto a S3. La posta verso un indirizzo vero va provata
  # con un mittente vero, e su un dominio nuovo finisce nello spam senza dare
  # errore.
  mailpit:
    image: axllent/mailpit:latest
    container_name: propflow-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # 1025 SMTP, 8025 l'interfaccia in cui si leggono i messaggi.
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    image: propflow:dev
    command: ["propflow-api"]
    environment:
      # Ruolo soggetto a Row Level Security.
      PROPFLOW__DATABASE__APPLICATION_URL: postgres://propflow_app:app@postgres:5432/propflow
      # Ruolo con BYPASSRLS: solo flussi pre-autenticazione.
      PROPFLOW__DATABASE__PRIVILEGED_URL: postgres://propflow_worker:worker@postgres:5432/propflow
      PROPFLOW__AUTH__PRIVATE_KEY_PATH: /run/secrets/jwt_ed25519.pem
      PROPFLOW__AUTH__PUBLIC_KEY_PATH: /run/secrets/jwt_ed25519.pub.pem
      PROPFLOW__STORAGE__ENDPOINT: http://minio:9000
      PROPFLOW__STORAGE__BUCKET: propflow-documents
      PROPFLOW__STORAGE__ACCESS_KEY_ID: propflow
      PROPFLOW__STORAGE__SECRET_ACCESS_KEY: propflow-dev-secret
      # La posta è **obbligatoria** all'avvio: da quando esiste il recupero della
      # password è l'unica via verso chi è chiuso fuori dal proprio account, e
      # un'API che parte senza saper spedire risponderebbe `202` senza mandare
      # niente. In chiaro perché il raccoglitore non cifra: `none` è ammesso solo
      # qui, un relay vero raggiunto così manderebbe credenziali sulla rete.
      PROPFLOW__MAIL__HOST: mailpit
      PROPFLOW__MAIL__PORT: "1025"
      PROPFLOW__MAIL__ENCRYPTION: none
      PROPFLOW__MAIL__FROM_ADDRESS: propflow@localhost
      PROPFLOW__TELEMETRY__JSON_LOGS: "true"
      # Lo stack di compose parla HTTP su `localhost`, e un browser non manda un
      # cookie `Secure` su HTTP: senza questa riga il refresh fallirebbe sempre e
      # la sessione durerebbe i quindici minuti dell'access token. In produzione
      # va lasciata al default, che è `true`.
      PROPFLOW__SERVER__SECURE_COOKIES: "false"
    volumes:
      # Le chiavi arrivano come file in sola lettura, non da variabili d'ambiente:
      # generarle con ./ops/dev/generate-jwt-keys.sh
      - ./.secrets:/run/secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "propflow-api --version >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Il client, dietro il reverse proxy che realizza il contratto **una sola
  # origine**: `/` ai file statici, `/api/v1` all'API. È l'unica porta che si apre
  # verso l'esterno; quella dell'API resta esposta perché in sviluppo serve
  # Swagger UI, che sta fuori dal prefisso `/api/v1`.
  web:
    build:
      context: .
      target: web
    image: propflow-web:dev
    environment:
      PROPFLOW_API_UPSTREAM: api:8080
    ports:
      - "8081:8080"
    depends_on:
      - api
    read_only: true
    # Caddy scrive la propria configurazione e i certificati: con il filesystem in
    # sola lettura gli servono due volumi effimeri, altrimenti non parte.
    tmpfs:
      - /tmp
      - /data
      - /config
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    image: propflow:dev
    command: ["propflow-worker"]
    environment:
      PROPFLOW__DATABASE__PRIVILEGED_URL: postgres://propflow_worker:worker@postgres:5432/propflow
      # Lo **stesso** bucket dell'API: il worker legge le scansioni che l'API ha
      # scritto, e due configurazioni divergenti darebbero job falliti su documenti
      # che l'API mostra benissimo.
      PROPFLOW__STORAGE__ENDPOINT: http://minio:9000
      PROPFLOW__STORAGE__BUCKET: propflow-documents
      PROPFLOW__STORAGE__ACCESS_KEY_ID: propflow
      PROPFLOW__STORAGE__SECRET_ACCESS_KEY: propflow-dev-secret
      RUST_LOG: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
