# Configurazione di git-cliff: il CHANGELOG si genera dai Conventional Commits.
#
# Scritto e non generato a mano perché i messaggi di commit li abbiamo già nella
# forma giusta, e un changelog mantenuto a parte diverge dalla storia al primo
# rilascio in cui qualcuno ha fretta.

[changelog]
header = """
# Changelog

Tutte le modifiche degne di nota. Il formato segue [Keep a Changelog](https://keepachangelog.com/),
le versioni seguono [Semantic Versioning](https://semver.org/) sul ramo 0.x: prima
di 1.0 le rotture di compatibilità alzano il *minor*.

Generato da [git-cliff](https://git-cliff.org/) a partire dai Conventional Commits.
Vedi `docs/10-rilasci.md`.

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Non rilasciato
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_parsers = [
  { message = "^feat", group = "Funzionalità" },
  { message = "^fix", group = "Correzioni" },
  { message = "^perf", group = "Prestazioni" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentazione" },
  { message = "^test", group = "Test" },
  { message = "^build", group = "Build" },
  # chore e ci non compaiono: chi legge un changelog vuole sapere cosa è cambiato
  # per lui, non che abbiamo cambiato una action.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^Merge", skip = true },
]

filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
