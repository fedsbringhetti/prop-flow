# Configurazione di git-cliff: il CHANGELOG si genera dai Conventional Commits.
#
# Scritto e non generato a mano perché i messaggi di commit li abbiamo già nella
# forma giusta, e un changelog mantenuto a parte diverge dalla storia al primo
# rilascio in cui qualcuno ha fretta.
#
# Tutto ciò che finisce nel template è in inglese: da qui derivano sia
# `CHANGELOG.md` sia il corpo delle GitHub Release, che sono superfici pubbliche.
# I commenti di questo file no: non li legge nessuno da fuori.

[changelog]
header = """
# Changelog

All notable changes. The format follows [Keep a Changelog](https://keepachangelog.com/),
versions follow [Semantic Versioning](https://semver.org/) on the 0.x line: before
1.0, breaking changes bump the *minor*.

Generated by [git-cliff](https://git-cliff.org/) from Conventional Commits.
See `docs/10-rilasci.md`.

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  # chore e ci non compaiono: chi legge un changelog vuole sapere cosa è cambiato
  # per lui, non che abbiamo cambiato una action.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^Merge", skip = true },
]

filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
