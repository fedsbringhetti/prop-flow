[dev-dependencies]
tower = { workspace = true, features = ["util"] }
serde_json.workspace = true
uuid.workspace = true
# Il doppio in memoria di `ObjectStorage` implementa un trait `async_trait` e
# calcola lo stesso digest dell'adattatore vero: senza, verificherebbe un
# checksum inventato.
async-trait.workspace = true
sha2.workspace = true
# Il contratto dell'OCR fa girare anche il **worker**, che non è un bordo HTTP:
# serve il pool privilegiato, e serve l'advisory lock che serializza i test che
# consumano la coda dei job — globale per costruzione.
sqlx.workspace = true

