name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Richiamabile dal workflow di rilascio: la verifica di un tag è *la stessa* di
  # quella di una pull request, non una copia che col tempo diverge.
  workflow_call:

# Un push che arriva mentre la pipeline precedente sullo stesso ref è ancora in
# corso la annulla: nessuno guarda l'esito di un commit già superato.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # I job non compilano mai per il debugger: senza informazioni di debug la cache
  # resta molto più piccola e il ripristino è più rapido.
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Decide se la revisione tocca qualcosa che valga la pena verificare.
  #
  # PERCHÉ UN JOB E NON `paths-ignore` SUL TRIGGER
  # `paths-ignore` sembra la via ovvia ed è la trappola: impedisce al workflow di
  # partire, quindi il check richiesto `CI` **non viene mai riportato** e la
  # protezione del branch tiene la pull request bloccata su «Expected — waiting for
  # status» finché qualcuno non tocca un file di codice. Saltare i job invece li
  # lascia in stato `skipped`, che il riepilogo qui sotto considera un successo:
  # la sua condizione guarda `failure` e `cancelled`, non `skipped`.
  #
  # FAIL-SAFE: NEL DUBBIO SI ESEGUE TUTTO
  # Ogni caso non previsto — un intervallo di commit che non si riesce a
  # calcolare, un primo push su un branch, la chiamata da `release.yml` su un tag —
  # restituisce `code=true`. L'asimmetria è voluta: un salto sbagliato manda su
  # `dev` codice che nessuno ha verificato, un'esecuzione di troppo costa minuti.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.compare.outputs.code }}
      web: ${{ steps.compare.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Serve la storia e non il solo ultimo commit: il confronto è fra due
          # revisioni, e con la profondità 1 la base non esiste nel clone. Il
          # repository è piccolo, quindi si prende tutta.
          fetch-depth: 0

      - name: Compare
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          run_everything() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "$1: running every job"
            exit 0
          }

          # `github.event_name` resta quello del *chiamante*: la chiamata da
          # `release.yml` è il push di un tag, quindi arriva qui come `push` con
          # `github.ref` su `refs/tags/...` e nessun `before` utile. Cade nel
          # fail-safe, che è ciò che si vuole — la verifica di un tag non si salta.
          case "$EVENT" in
            pull_request) RANGE="${BASE_SHA}...${HEAD_SHA}" ;;
            push)
              if [[ "$REF" != refs/heads/* ]]; then
                run_everything "not a branch push"
              fi
              if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                run_everything "no usable previous revision"
              fi
              RANGE="${BEFORE}..${HEAD_SHA}"
              ;;
            *) run_everything "unhandled event \`${EVENT}\`" ;;
          esac

          if ! FILES="$(git diff --name-only "$RANGE" 2>/dev/null)"; then
            run_everything "could not diff \`${RANGE}\`"
          fi
          if [[ -z "$FILES" ]]; then
            run_everything "empty diff"
          fi

          echo "changed files:"
          echo "$FILES" | sed 's/^/  /'

          # Un file è «documentazione» solo se lo è con certezza. L'elenco è
          # deliberatamente corto: allargarlo è facile e ogni voce in più è una
          # classe di modifiche che nessuno verificherà più.
          #
          # `docs/07-operazioni.md` è l'eccezione, e non è un dettaglio:
          # `crates/api/tests/docs_config_reference.rs` deriva le impostazioni da
          # `AppConfig` e dal migratore e **fallisce** se manca la riga
          # corrispondente in quel documento. È l'unico file di sola prosa che può
          # rompere `cargo test`, quindi è l'unico che non si salta.
          #
          # DUE USCITE E NON UNA
          # `apps/web/` è il client, e verificarlo costa un minuto di npm; il
          # backend costa sette minuti di test su PostgreSQL. Senza la distinzione
          # un cambio di CSS li pagherebbe entrambi, e con il tempo si smette di
          # aspettare la pipeline — che è il modo in cui una pipeline diventa
          # inutile. L'asimmetria del fail-safe resta: nel dubbio si esegue tutto.
          #
          # I percorsi Rust sono elencati **per estensione** e non per esclusione:
          # un file nuovo alla radice — un Dockerfile, un compose, un workflow —
          # cade nel ramo finale, che accende entrambe. Un elenco che sbaglia in
          # eccesso costa minuti; uno che sbaglia in difetto manda su `dev` codice
          # che nessuno ha verificato.
          #
          # Nei pattern di `case` l'asterisco attraversa le barre, quindi `docs/*`
          # copre l'intero albero e `*.md` copre ogni markdown ovunque si trovi.
          CODE=false
          WEB=false
          while IFS= read -r FILE; do
            case "$FILE" in
              docs/07-operazioni.md) CODE=true ;;
              docs/*) ;;
              *.md) ;;
              LICENSE|.gitignore|.gitattributes|.editorconfig) ;;
              apps/web/*) WEB=true ;;
              crates/*|migrations/*|ops/*|config/*|tests/*) CODE=true ;;
              Cargo.toml|Cargo.lock|rust-toolchain.toml|deny.toml) CODE=true ;;
              *) CODE=true; WEB=true ;;
            esac
          done <<< "$FILES"

          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB}" >> "$GITHUB_OUTPUT"
          echo "backend: ${CODE}, web client: ${WEB}"
          if [[ "$CODE" == "false" && "$WEB" == "false" ]]; then
            echo "documentation only: the heavy jobs are skipped"
          fi

  # ---------------------------------------------------------------------------
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # Nessuna action per il toolchain: la versione è fissata in
      # rust-toolchain.toml, e rustup la installa da sé. Una seconda dichiarazione
      # nel workflow sarebbe un secondo posto da tenere allineato.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Format
        run: cargo fmt --all --check

      # I lint del workspace già negano unwrap/expect/panic/unsafe. `-D warnings`
      # aggiunge tutto il resto: un avviso che nessuno legge è un avviso che non
      # esiste.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  architecture:
    name: Architecture constraints
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: architecture

      # Il dominio non deve dipendere dall'infrastruttura, l'application layer non
      # deve conoscere quella concreta, e negli handler HTTP non ci deve essere
      # SQL. Sono i vincoli tassativi del progetto: verificati, non promessi.
      - name: Domain purity
        run: ./ops/ci/check-domain-purity.sh

  # ---------------------------------------------------------------------------
  test:
    name: Tests on a real PostgreSQL
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # locale C: ordinamenti e vincoli unique deterministici, come in locale
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      # Stessa procedura del runner locale: database, tre ruoli con privilegi
      # minimi, migration applicate dal binario di deploy e non da psql.
      - name: Prepare the database
        run: ./ops/ci/prepare-database.sh >> "$GITHUB_ENV"

      # MinIO non è un service container: la sua immagine vuole `server /data`
      # come comando, e i service di GitHub Actions non lo permettono. Lo script è
      # lo stesso che usa il runner locale.
      - name: Prepare the object storage
        run: ./ops/ci/prepare-object-storage.sh >> "$GITHUB_ENV"

      - name: Schema invariants
        run: ./ops/ci/check-schema.sh "$PROPFLOW_TEST_MIGRATOR_URL"

      # Il migratore deve essere idempotente: una seconda esecuzione su un
      # database già migrato non deve riapplicare nulla né creare una seconda
      # tabella di bookkeeping. È un errore che si manifesterebbe solo al primo
      # redeploy, quindi va verificato qui.
      - name: Idempotent migrations
        run: |
          PROPFLOW__DATABASE__MIGRATOR_URL="$PROPFLOW_TEST_MIGRATOR_URL" \
          PROPFLOW__DATABASE__MIGRATIONS_DIR="$PWD/migrations" \
            cargo run --quiet --locked -p propflow-migrator
          ./ops/ci/check-schema.sh "$PROPFLOW_TEST_MIGRATOR_URL"

      - name: Ephemeral signing keys
        run: ./ops/dev/generate-jwt-keys.sh "${{ runner.temp }}/secrets"

      # `--nocapture` serve al controllo che segue: senza di esso l'harness
      # nasconde l'output dei test passati, compreso l'avviso di quelli saltati.
      #
      # Se le variabili del database non arrivassero, i test di integrazione si
      # dichiarerebbero saltati e la suite passerebbe senza aver verificato nulla.
      # Il grep rende impossibile un verde silenzioso.
      - name: Suite
        env:
          PROPFLOW_TEST_JWT_PRIVATE_KEY: ${{ runner.temp }}/secrets/jwt_ed25519.pem
          PROPFLOW_TEST_JWT_PUBLIC_KEY: ${{ runner.temp }}/secrets/jwt_ed25519.pub.pem
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --test-threads=4 --nocapture \
            | tee "${{ runner.temp }}/test-output.log"
          # `SALTATO` è la parola che stampa l'harness dei test, che è in italiano
          # come il resto del codice: è un contratto con i test, non una stringa
          # rivolta a chi legge la pipeline.
          if grep -q 'SALTATO' "${{ runner.temp }}/test-output.log"; then
            echo "::error::integration tests were skipped: incomplete test environment"
            grep 'SALTATO' "${{ runner.temp }}/test-output.log"
            exit 1
          fi
          echo "no test was skipped"

  # ---------------------------------------------------------------------------
  # Il client web. Un job solo: le quattro verifiche stanno in un minuto insieme,
  # e dividerle costerebbe quattro installazioni di `node_modules` per risparmiare
  # secondi.
  web:
    name: Web client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` e non `npm install`: installa esattamente il lockfile e fallisce
      # se manifest e lock divergono, che è l'equivalente di `cargo --locked`.
      - name: Install
        run: npm ci

      # `strict` acceso e niente `any`: è l'equivalente di «zero warning» del
      # backend, e il typecheck è ciò che lo rende vero invece che dichiarato.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fra questi c'è il test del **refresh a singolo volo**, che riproduce anche
      # il difetto: senza la promessa condivisa tre richieste parallele fanno tre
      # chiamate di refresh e l'API revoca la catena.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Costruisce l'immagine. **Gira anche per una modifica al solo client**, perché
  # l'immagine lo contiene: una dipendenza nuova in `package.json` può rompere la
  # build senza toccare una riga di Rust.
  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Si costruisce e non si pubblica: la pipeline verifica che l'immagine sia
      # producibile, la pubblicazione è una decisione di release.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  dependencies:
    name: Vulnerabilities and provenance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # Il binario installato sul runner, non l'action containerizzata: quella gira
      # in un'immagine Alpine con un Rust proprio, dove il pin di
      # rust-toolchain.toml non esiste e rustup emette un errore fuorviante. Qui il
      # toolchain si risolve normalmente, non serve il pull di un'immagine da
      # 239 MB, e l'output di cargo-deny compare nel log del passo.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # advisories: CVE note e crate ritirati. bans: versioni duplicate della
      # stessa libreria e wildcard verso crates.io. sources: nessuna dipendenza da
      # registry o git non attesi.
      # Il controllo delle licenze richiede una allow-list curata e arriverà con
      # quella: un gate che dà falsi rossi viene disattivato entro una settimana.
      - name: cargo-deny
        run: cargo deny --all-features check advisories bans sources

  # ---------------------------------------------------------------------------
  # Job di riepilogo: è l'unico che conviene richiedere nella protezione del
  # branch, così aggiungere un job non richiede di riconfigurare GitHub.
  #
  # Il nome `CI` è il check richiesto dalla protezione di `main` e `dev`:
  # rinominarlo la farebbe cercare un check che non esiste più, bloccando ogni
  # merge finché non la si riconfigura via `gh api`.
  #
  # **Gira sempre**, anche quando tutti i job che precede sono saltati: è ciò che
  # permette a una pull request di sola documentazione di ottenere il verde invece
  # di restare in attesa di un check che non arriverà mai. La condizione guarda
  # `failure` e `cancelled` e **non** `skipped`, che qui è un esito legittimo — se
  # guardasse anche quello, saltare un job equivarrebbe a farlo fallire.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, lint, architecture, test, web, image, dependencies]
    if: always()
    steps:
      - name: Outcome
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::at least one job failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.code }}" != "true" && "${{ needs.changes.outputs.web }}" != "true" ]]; then
            echo "documentation only: nothing to verify"
            exit 0
          fi
          echo "every job passed"
